name: Consumer Dependency QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  consumer-qa:
    name: consumer-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json
      # Inspect the checkout before npm ci replaces the tracked dependency tree.
      - name: Check vendored package versions against consumer lock
        run: node scripts/check-vendored-lock.js
      - name: Install consumer dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev
      - name: Audit consumer dependencies (not book-formatter)
        run: npm audit --audit-level=high --include=dev
      - name: Test consumer contracts
        run: npm test
      - name: Lint consumer code
        run: npm run lint
      - name: Check consumer links
        run: npm run check-links
